name: 同步并发布 (apt + npm)

# ---------------------------------------------------------------------------
# 自动检测 esengine/DeepSeek-Reasonix 上游 CLI 版本变化
# 构建 GOOS=android GOARCH=arm64 静态二进制 + deb 包 + apt 源元数据
# (patch atotto/clipboard 绕过 Android seccomp faccessat2 bug)
#
# 发布双通道:
#   1) apt orphan 分支  (Termux: pkg install reasonix)
#   2) npm 包 reasonix-termux (Termux: npm i -g reasonix-termux)
#
# 上游:    https://github.com/esengine/DeepSeek-Reasonix
# apt 源:  deb [trusted=yes] https://raw.githubusercontent.com/<OWNER>/<REPO>/apt stable main
# npm 包:  https://www.npmjs.com/package/reasonix-termux
#
# v2 适配记录 (2026-10):
#   - 上游 CLI 升级 v2.x 后包结构变化:
#       internal/config/mutate.go → internal/contract/config/mutate.go
#       internal/productdocs      → internal/tools/productdocs
#     因此 patch/ldflags 均改为动态探测路径, 不再硬编码
#   - Desktop 产品改名 Studio: tag 从 desktop-v* 变为 studio-v*,
#     CLI tag 过滤改为白名单 ^v[0-9], 防止误取 studio tag
#   - 官方 Makefile ldflags 改为 -X main.version/gitCommit/buildTimeUTC
#
# License: GPL-3.0
#   本 workflow 及仓库内所有脚本/资源按 GPL-3.0 发布
#   详见仓库根 LICENSE 文件或 https://www.gnu.org/licenses/gpl-3.0.html
# ---------------------------------------------------------------------------

on:
  schedule:
    # 每 6 小时检查一次上游 (UTC 00:30/06:30/12:30/18:30 -> Asia/Shanghai 08:30/14:30/20:30/02:30)
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（即使上游无更新）"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      tag:
        description: "指定上游 tag 覆盖自动检测 (例: v1.19.7)"
        required: false
        type: string

permissions:
  contents: write    # 需要 push 到 apt 分支 + commit version.txt
  actions: read

concurrency:
  group: termux-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix
  # Termux apt 架构名 (注意: 是 aarch64 不是 arm64)
  TERMUX_ARCH: aarch64
  # Go 目标
  GOOS_TARGET: android
  GOARCH_TARGET: arm64
  # 发布分支 - orphan, 类似 gh-pages, 只放 apt 源文件
  APT_BRANCH: apt
  APT_DIST: stable
  APT_COMPONENT: main
  # Termux 安装前缀 (deb 数据文件路径)
  TERMUX_PREFIX: /data/data/com.termux/files/usr

jobs:
  detect:
    name: 检测上游版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: 检出本仓库 (main 分支, 用于读 version.txt)
        uses: actions/checkout@v7

      - name: 读取当前已发布版本
        id: current
        run: |
          if [ -f version.txt ]; then
            CUR=$(tr -d '[:space:]' < version.txt)
          else
            CUR="none"
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "::notice::当前已发布版本: $CUR"

      - name: 查询上游最新 CLI tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub API 列出最近 30 个 release, 取最新的 CLI stable tag
          #
          # tag 白名单 (关键鲁棒性修复):
          #   只接受 ^v[0-9] 开头的 tag, 自动排除:
          #     - studio-v* (2026-10 起 Desktop 改名 Studio, 旧黑名单 ^desktop- 漏掉了它,
          #       而它和对应 CLI tag 同一秒创建, 列表顺序不稳定, 有误取的风险)
          #     - desktop-v* / npm-* (同理由白名单一并排除)
          #
          # 认证 + 重试 (定时任务鲁棒性):
          #   - 用 GITHUB_TOKEN 认证 (5000 req/h), 避免匿名共享 IP 池 60 req/h 被限流
          #   - 网络抖动 / API 5xx / 限流时重试, 共 3 次机会
          fetch_latest_tag() {
            curl -fsSL --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: termux-sync-bot" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=30" \
            | jq -e -r '[.[] | select(.prerelease == false and (.tag_name | test("^v[0-9]")))][0].tag_name'
          }
          UPSTREAM=""
          for i in 1 2 3; do
            if UPSTREAM=$(fetch_latest_tag); then
              break
            fi
            UPSTREAM=""
            echo "::warning::查询上游 release 失败 (第 ${i}/3 次), 10s 后重试..."
            sleep 10
          done
          if [ -z "$UPSTREAM" ] || [ "$UPSTREAM" = "null" ]; then
            echo "::error::无法获取上游最新 CLI tag (重试 3 次均失败)"
            exit 1
          fi
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "::notice::上游最新 CLI tag: $UPSTREAM"

      - name: 决定是否需要发布
        id: check
        run: |
          set -euo pipefail
          UP="${{ inputs.tag || steps.upstream.outputs.upstream }}"
          CUR="${{ steps.current.outputs.current }}"
          FORCE="${{ inputs.force || 'false' }}"

          echo "upstream_tag=$UP" >> "$GITHUB_OUTPUT"
          echo "current_tag=$CUR" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 发布 (force=true, tag=$UP)"
          elif [ "$UP" != "$CUR" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 发布 (上游=$UP 与当前=$CUR 不一致)"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 跳过 (已处于 $CUR)"
          fi

  build:
    name: 构建二进制 + deb + apt 源
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    timeout-minutes: 40
    # 用普通 ubuntu-latest (amd64) runner 交叉编译即可
    #
    # 历史背景: 早期版本曾用 ubuntu-24.04-arm + termux-docker 镜像构建,
    # 当时的注释声称 "ubuntu 交叉编译 GOOS=android 时 runtime.GOOS 实际是 linux"
    # 这个说法是错的 - 实测验证 (Go 1.23) runtime.GOOS 是编译时常量,
    # 由 GOOS 环境变量决定, 与 host OS 无关:
    #   - GOOS=android 交叉编译 → runtime.GOOS == "android" ✓
    #   - GOOS=linux  交叉编译 → runtime.GOOS == "linux"
    #
    # Go 源码证据 (src/syscall/syscall_linux.go Faccessat 函数):
    #   if runtime.GOOS != "android" {
    #       faccessat2(...)  // Android seccomp 拦截这个
    #   }
    #   // fallback to fstatat + permission bits
    #
    # 所以只要 GOOS=android 编译, 就不会调 faccessat2, 不会 SIGSYS
    # 参考: golang/go#57393
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
    steps:
      - name: 检出本仓库 (main 分支)
        uses: actions/checkout@v7

      - name: 检出上游 Reasonix (tag ${{ env.UPSTREAM_TAG }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          fetch-depth: 1

      - name: 设置 Go (基于 upstream go.mod)
        # setup-go 最新主版本 v7 (最新 release: v7.0.0, 2026-07-16)
        # 用 @v7 浮动 tag: 自动跟进 v7.x.x 补丁, 不跨大版本 (避免 breaking change)
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod
          cache: true   # 启用 go module 缓存
          # 缓存依赖文件在 upstream/ 子目录, 不指定会找不到 go.mod 导致缓存永远 miss
          cache-dependency-path: upstream/go.sum

      - name: Patch 源码 (TMPDIR + /tmp 硬编码 + clipboard LookPath)
        working-directory: upstream
        run: |
          set -euo pipefail
          # Patch 1: TMPDIR + /tmp 硬编码
          # 根因: Reasonix 用 os.MkdirTemp("", ...) → 默认 /tmp
          #   + 锁文件路径硬编码 /tmp (v1 在 internal/config/mutate.go,
          #     v2 移到了 internal/contract/config/mutate.go, 硬编码路径曾直接报错)
          # Termux/Android 上 /tmp 只读 → "mkdir /tmp/reasonix-config-locks-...: permission denied"
          # 修复: 1. main() 入口设 TMPDIR=~/.reasonix/tmp/
          #       2. 硬编码 /tmp 改成 os.TempDir()
          # 脚本已改为递归搜索 pattern, 不再依赖具体路径 (v2 重构免疫)
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- 验证锁文件 patch ---"
          if grep -rq 'os.TempDir(), fmt.Sprintf("reasonix-config-locks' --include='*.go' internal/; then
            grep -rn 'os.TempDir(), fmt.Sprintf("reasonix-config-locks' --include='*.go' internal/ | head -3
          else
            echo "::warning::锁文件 /tmp 硬编码 pattern 不存在 (可能上游已修复), 跳过验证"
          fi

          # Patch 2: atotto/clipboard init() 跳过 LookPath
          # 性能优化 (非必须, GOOS=android 时不会 SIGSYS, 但能省启动时间):
          #   原实现 init() 调多次 exec.LookPath (xclip/xsel/wlcopy/...)
          #   patch 后直接设 termux-clipboard-get/set, 不调 LookPath
          # 源码位置注意: 上游仓库不 vendor 依赖, 在上游 checkout 里永远找不到,
          #   旧写法 find . 从未命中过 → 改为在 Go module cache (GOMODCACHE) 中定位
          go mod download github.com/atotto/clipboard || echo "::warning::go mod download clipboard 失败, 尝试从现有缓存查找"
          MODCACHE=$(go env GOMODCACHE)
          CLIPBOARD_FILE=$(find "${MODCACHE}"/github.com/atotto -name 'clipboard_unix.go' 2>/dev/null | head -1 || true)
          # 兜底: 上游若未来 vendor 依赖, checkout 里也能找到
          if [ -z "$CLIPBOARD_FILE" ]; then
            CLIPBOARD_FILE=$(find . -path '*/atto/clipboard/clipboard_unix.go' 2>/dev/null | head -1 || true)
          fi
          if [ -n "$CLIPBOARD_FILE" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/patch-clipboard.py" "$CLIPBOARD_FILE"
            echo "--- Patched $CLIPBOARD_FILE ---"
            sed -n '/^func init/,/^}/p' "$CLIPBOARD_FILE" | head -15
          else
            echo "::warning::未找到 atotto/clipboard/clipboard_unix.go, 跳过 clipboard patch (可选优化)"
          fi

      - name: 交叉编译 (GOOS=android GOARCH=arm64 CGO_ENABLED=0)
        working-directory: upstream
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"
          COMMIT=$(git rev-parse --short HEAD)

          mkdir -p ../build

          # -X 注入目标动态探测 (v2 教训: internal/productdocs 移到了
          # internal/tools/productdocs, 硬编码路径会让 -X 静默失效,
          # --version 显示 dev 而不报错, 只能靠下面的 host 实测步骤兜底)
          PRODUCTDOCS_DIR=$(find internal -type d -name productdocs 2>/dev/null | sort | head -1 || true)
          LDFLAGS="-s -w -X main.version=${TAG} -X main.gitCommit=${COMMIT}"
          if [ -n "$PRODUCTDOCS_DIR" ]; then
            LDFLAGS="${LDFLAGS} -X reasonix/${PRODUCTDOCS_DIR}.linkedVersion=${TAG} -X reasonix/${PRODUCTDOCS_DIR}.linkedRevision=${COMMIT}"
            echo "productdocs 包: ${PRODUCTDOCS_DIR} (注入 linkedVersion/linkedRevision)"
          else
            echo "::warning::未找到 productdocs 包, 跳过 linkedVersion 注入"
          fi
          echo "LDFLAGS: ${LDFLAGS}"
          # 传给后面的版本验证步骤复用 (保证两个构建注入参数完全一致)
          echo "LDFLAGS=${LDFLAGS}" >> "$GITHUB_ENV"

          echo "=== go build (host=$(go version)) ==="
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -ldflags "${LDFLAGS}" \
            -o ../build/reasonix \
            ./cmd/reasonix

          echo "=== build info ==="
          ls -lh ../build/reasonix
          file ../build/reasonix

      - name: 静态验证二进制 (不运行, host 跑不了 android/arm64 二进制)
        run: |
          set -euo pipefail
          # 不能在 ubuntu amd64 上运行 android/arm64 二进制 (需要 /system/bin/linker64)
          # 改用静态验证: go version -m + strings + file
          echo "=== file ==="
          file build/reasonix

          echo ""
          echo "=== go version -m (build settings) ==="
          go version -m build/reasonix | head -20

          echo ""
          echo "=== GOOS / GOARCH 强校验 ==="
          BUILD_GOOS=$(go version -m build/reasonix | awk '/^\s+build\s+GOOS=/{split($2,a,"="); print a[2]}')
          BUILD_GOARCH=$(go version -m build/reasonix | awk '/^\s+build\s+GOARCH=/{split($2,a,"="); print a[2]}')
          echo "构建时 GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH"

          if [ "$BUILD_GOOS" != "android" ]; then
            echo "::error::GOOS=$BUILD_GOOS (应为 android), 二进制会在 Android 上 SIGSYS 崩溃"
            echo "排查: 检查 go build 命令是否设置了 GOOS=android 环境变量"
            exit 1
          fi
          if [ "$BUILD_GOARCH" != "arm64" ]; then
            echo "::error::GOARCH=$BUILD_GOARCH (应为 arm64)"
            exit 1
          fi
          echo "✓ GOOS=android GOARCH=arm64 (faccessat2 特判会生效, 不会 SIGSYS)"

          echo ""
          echo "=== faccessat2 syscall 字符串检查 (应为 0) ==="
          # Go runtime 在 GOOS=android 时不会编译进 faccessat2 调用
          # 如果二进制里出现 faccessat2 字符串, 说明编译配置错了
          # 注意: grep -c 没匹配时返回 exit 1, 在 set -e + pipefail 下会让脚本退出
          # 用 || true 兜底 (grep -c 仍然会输出 0)
          FACCESSAT2_COUNT=$(strings build/reasonix | grep -c 'faccessat2' || true)
          echo "faccessat2 出现次数: $FACCESSAT2_COUNT"
          if [ "$FACCESSAT2_COUNT" -gt 0 ]; then
            echo "::warning::二进制里出现 faccessat2 字符串, 可能调用了被 Android seccomp 拦截的 syscall"
            echo "(注: 字符串存在不等于一定调用, 但 GOOS=android 时正常应为 0)"
          fi

      - name: 验证版本注入 (host 构建 + --version 实测)
        working-directory: upstream
        run: |
          set -euo pipefail
          # android/arm64 二进制在 host 上跑不了, 但 -X 注入是链接期行为, 与目标平台无关:
          # 用完全相同的 LDFLAGS 构一个 host 二进制, 实跑 --version 验证版本号真的注入了。
          # 防止未来上游再挪包导致 -X 路径静默失效时, 发出 --version=dev 的包。
          echo "=== host 构建 (仅用于验证, 不发布) ==="
          CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" -o ../build/reasonix-host ./cmd/reasonix

          echo "=== 实测 --version ==="
          VERSION_OUT=$(timeout 60 ../build/reasonix-host --version || true)
          echo "${VERSION_OUT}"
          if ! echo "${VERSION_OUT}" | grep -qF "${UPSTREAM_TAG}"; then
            echo "::error::--version 输出不含 ${UPSTREAM_TAG}, -X 注入失效 (上游可能又改了包路径或版本变量)"
            echo "实际输出: ${VERSION_OUT}"
            echo "LDFLAGS: ${LDFLAGS}"
            exit 1
          fi
          echo "✓ 版本注入验证通过: ${VERSION_OUT}"

      - name: 打包 .deb
        run: |
          set -euo pipefail
          bash scripts/build-deb.sh \
            "${UPSTREAM_TAG}" \
            "${{ env.TERMUX_ARCH }}" \
            "${{ env.TERMUX_PREFIX }}" \
            build/reasonix \
            build/

      - name: 生成 apt 源元数据
        run: |
          set -euo pipefail
          bash scripts/build-apt-repo.sh \
            build/ \
            "${{ env.APT_DIST }}" \
            "${{ env.APT_COMPONENT }}" \
            "${{ env.TERMUX_ARCH }}" \
            apt-root/

      - name: 显示 apt 源目录树
        run: find apt-root -type f -exec ls -lh {} \;

      - name: 上传 apt-root 为 workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: apt-root
          path: apt-root/
          retention-days: 7
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # npm 发布需要的原始二进制 (apt 源打 .deb 用的就是这个二进制)
      # 同一份 build 产物, 双通道发布 (apt + npm), 不重复构建
      # ----------------------------------------------------------------------
      - name: 上传 reasonix 二进制为 workflow artifact (供 npm 发布)
        uses: actions/upload-artifact@v7
        with:
          name: reasonix-binary
          path: build/reasonix
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 发布到 orphan `apt` 分支
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
    steps:
      - name: 下载 apt-root artifact
        uses: actions/download-artifact@v8
        with:
          name: apt-root
          path: apt-root/

      - name: 检出 main 分支 (用于读 site/index.html + 后续更新 version.txt)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: main-branch
          fetch-depth: 1
          # persist-credentials 默认 true, 会把 GITHUB_TOKEN 写进 .git/config
          # 这样后面 git push 不需要再嵌入 token
          persist-credentials: true

      - name: 配置 git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 初始化 fresh orphan apt 分支 (始终单 commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 永远创建 fresh orphan 分支 - 历史永远只有 1 个 commit
          # 分支体积恒等于当前 deb 大小 + 主页 HTML, 不会随版本累积膨胀
          # 发布历史通过 main 分支的 version.txt commit log 保留
          mkdir -p apt-branch
          cd apt-branch
          git init -b ${{ env.APT_BRANCH }}
          # 关键: 必须把 GITHUB_TOKEN 嵌入 remote URL, 否则 push 时
          # git 会要求交互输入用户名密码, CI 无 TTY 导致 "could not read Username"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 用新构建产物替换 apt 分支内容
        run: |
          set -euo pipefail
          cd apt-branch

          # 复制新构建产物 (dists/stable/...)
          cp -a ../apt-root/. .

          # 复制主页 index.html (用于 GitHub Pages / Cloudflare Pages 部署)
          # 主页源文件在 main 分支的 site/ 目录, 由前面 checkout 步骤提供
          if [ -f ../main-branch/site/index.html ]; then
            cp ../main-branch/site/index.html ./index.html
            echo "✓ 已复制主页 index.html"
          else
            echo "::warning::未找到 site/index.html, 跳过主页部署"
          fi

          # .nojekyll: 告诉 GitHub Pages 跳过 Jekyll 处理
          # 避免 Jekyll 忽略下划线开头的文件/目录, 也加快 Pages 部署
          touch .nojekyll

          # CNAME: GitHub Pages 自定义域名
          # 内容为裸域名 rxt.cc.cd, 启用 GitHub Pages 后会自动绑定
          # (Cloudflare Pages 不需要此文件, 但留着不会影响)
          echo "rxt.cc.cd" > CNAME
          echo "✓ 已写入 CNAME (rxt.cc.cd)"

          # 写一个 README 给访问者
          cat > README.md <<'README_EOF'
          # Reasonix Termux APT 源 (自动发布)

          最新版本: ${UPSTREAM_TAG}

          ## 安装方法 (在 Termux 中)

          ```bash
          echo 'deb [trusted=yes] https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apt stable main' \
            > $PREFIX/etc/apt/sources.list.d/reasonix.list
          pkg update
          pkg install reasonix
          reasonix --version
          ```

          ## 分支内容

          这是一个 orphan 分支 (单 commit, 每次发布重置历史),
          只包含 apt 源文件 + 一个主页 index.html:

          ```
          index.html                                       # 项目主页 (GitHub Pages / Cloudflare Pages 用)
          dists/stable/Release                             # apt 元数据
          dists/stable/main/binary-aarch64/Packages        # 包索引
          dists/stable/main/binary-aarch64/Packages.gz     # 包索引 (gzip)
          dists/stable/main/binary-aarch64/reasonix_<version>_aarch64.deb
          ```

          源 workflow 在 main 分支上。
          README_EOF

          # 把 ${UPSTREAM_TAG} 和 ${GITHUB_REPOSITORY} 填进 README
          # (上面的 'README_EOF' 用了单引号防止 $ 提前展开, 这里手动替换)
          sed -i \
            -e "s|\${UPSTREAM_TAG}|${UPSTREAM_TAG}|g" \
            -e "s|\${GITHUB_REPOSITORY}|${GITHUB_REPOSITORY}|g" \
            README.md

          # 显示将要提交的内容
          echo "--- 待提交文件 ---"
          find . -mindepth 1 -maxdepth 5 -not -path './.git*' -type f | sort

          git add -A
          git status

      - name: 提交并 force-push 到 apt 分支 (orphan, 单 commit)
        run: |
          set -euo pipefail
          cd apt-branch

          # orphan commit - 没有父 commit
          git commit --allow-empty -m "发布 reasonix ${UPSTREAM_TAG}

          构建参数: GOOS=android GOARCH=arm64 CGO_ENABLED=0
          Patch: atotto/clipboard init() 绕过 Android seccomp faccessat2 bug
          上游源码: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${UPSTREAM_TAG}"

          # Force push - orphan 分支每次都覆盖, 永远只有 1 个 commit
          # 优势: 分支体积 ≈ 当前 deb 大小, 不随版本累积
          # 发布历史通过 main 分支的 version.txt commit log 保留
          git push origin ${{ env.APT_BRANCH }} --force

      - name: 在 main 分支提交 version.txt
        run: |
          set -euo pipefail
          cd main-branch
          echo "${UPSTREAM_TAG}" > version.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if git diff --cached --quiet; then
            echo "version.txt 未变化"
          else
            git commit -m "chore: 已发布版本更新为 ${UPSTREAM_TAG}"
            # push 带一次重试: 若运行期间远端 main 有新提交, rebase 后重试
            # (并发组已限制本 workflow 串行, 这里主要防人工 push 撞车)
            if ! git push; then
              echo "::warning::push 失败, rebase 远端最新后重试"
              git pull --rebase origin "${{ github.ref_name }}"
              git push
            fi
          fi

      - name: 汇总
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 已发布: \`${UPSTREAM_TAG}\`

          推送到 orphan 分支 \`${{ env.APT_BRANCH }}\` (force-push, 单 commit)。

          ### Termux 安装命令:

          \`\`\`bash
          echo 'deb [trusted=yes] https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list
          pkg update
          pkg install reasonix
          reasonix --version
          \`\`\`

          ### 备用镜像 (如果 raw.githubusercontent.com 被墙):

          \`\`\`bash
          # jsDelivr CDN (海外更快, 国内有时被墙)
          echo 'deb [trusted=yes] https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list

          # GitHub /raw/ URL (同 raw, 走 github.com 域名)
          echo 'deb [trusted=yes] https://github.com/${GITHUB_REPOSITORY}/raw/${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list
          \`\`\`

          ### apt 分支上的文件:

          \`\`\`
          index.html                                          # 项目主页 (Pages 部署用)
          dists/stable/Release
          dists/stable/main/binary-aarch64/Packages
          dists/stable/main/binary-aarch64/Packages.gz
          dists/stable/main/binary-aarch64/reasonix_${UPSTREAM_TAG#v}_aarch64.deb
          \`\`\`

          ### 主页访问 (启用 GitHub Pages / Cloudflare Pages 后):

          - GitHub Pages: \`https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}/\`
            (仓库 Settings → Pages → Source = apt 分支)
          - Cloudflare Pages: 自定义域名 (Production branch = apt)
          - 直接访问 raw: \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ env.APT_BRANCH }}/index.html\`
          EOF

  # ===========================================================================
  # npm 发布 job
  # ===========================================================================
  # 走社区标准: actions/setup-node + npm publish --provenance --access public
  # 认证模式: npm trusted publishing (OIDC), 2026 主流推荐
  #
  # OIDC 工作原理:
  #   - workflow 申明 id-token: write 权限 → GitHub Actions 生成 OIDC token
  #   - npm 端配置 trusted publisher (repo + workflow filename)
  #   - npm publish --provenance 时, npm CLI 用 OIDC token 换短期 publish token
  #   - 无长期 NPM_TOKEN secret, 无 token 泄露风险, 自动轮换
  #
  # 一次性配置 (在 npmjs.com 上做):
  #   1. 用包 owner 账号登录 https://www.npmjs.com/package/reasonix-termux/access
  #   2. Publishing access → Configure GitHub Actions trusted publishing
  #   3. 填:
  #        Repository owner:  masgzy
  #        Repository name:   reasonix-termux
  #        Workflow filename: sync-and-publish.yml
  #        Environment:       (留空)
  #   4. 保存. 后续每次 workflow 跑都会自动用 OIDC 认证
  #
  # 关键: 不要给 setup-node 加 registry-url, 否则会在 .npmrc 写空 token 占位符
  #       干扰 OIDC 流程; 也不要给 publish 步骤加 NODE_AUTH_TOKEN env
  #
  # 参考:
  #   - https://docs.github.com/actions/publishing-packages/publishing-nodejs-packages
  #   - https://docs.npmjs.com/trusted-publishers
  #   - https://docs.npmjs.com/generating-provenance-statements
  # ===========================================================================
  publish_npm:
    name: 发布到 npm (reasonix-termux)
    needs: [detect, build]
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write    # OIDC trusted publishing 必需: 让 GitHub 给 npm 签 OIDC token
      contents: read
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
    steps:
      - name: 检出本仓库 (main 分支, 用于读 npm/ 模板)
        uses: actions/checkout@v7

      - name: 下载 reasonix 二进制
        uses: actions/download-artifact@v8
        with:
          name: reasonix-binary
          path: staging/bin/

      - name: 确保二进制可执行 + 校验平台
        run: |
          set -euo pipefail
          chmod 0755 staging/bin/reasonix
          ls -lh staging/bin/reasonix
          file staging/bin/reasonix
          # publish_npm job 没装 Go, 用 strings 兜底检查 GOOS=android GOARCH=arm64
          # (build job 已用 `go version -m` 强校验过, 这里只是双保险)
          BUILD_GOOS=$(  strings staging/bin/reasonix | grep -m1 -oE 'GOOS=[a-z]+'   | cut -d= -f2 || true )
          BUILD_GOARCH=$(strings staging/bin/reasonix | grep -m1 -oE 'GOARCH=[a-z0-9]+' | cut -d= -f2 || true )
          echo "Binary GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH"
          if [ "$BUILD_GOOS" != "android" ] || [ "$BUILD_GOARCH" != "arm64" ]; then
            echo "::error::二进制不是 android/arm64, npm 包会在 Termux 上 SIGSYS 崩溃, 拒绝发布"
            exit 1
          fi
          echo "✓ 二进制是 android/arm64 (Termux 可用)"

      - name: 复制 npm 模板到 staging/
        run: |
          set -euo pipefail
          cp -v npm/package.json   staging/package.json
          cp -v npm/README.md      staging/README.md
          # LICENSE: npm 包只含二进制 (上游 MIT 派生), 所以放本仓库 LICENSE
          # (本仓库 LICENSE = GPL-3.0, README 已说明 binary 部分遵循上游 MIT)
          cp -v LICENSE            staging/LICENSE
          # .npmignore (额外黑名单兜底, 防止意外把开发文件打进去)
          cp -v npm/.npmignore     staging/.npmignore || true
          echo "--- staging 目录 ---"
          find staging -maxdepth 2 -type f -exec ls -lh {} \;

      - name: 设置 package.json 版本 (来自上游 tag)
        run: |
          set -euo pipefail
          # UPSTREAM_TAG 形如 v1.31.3 -> npm version 1.31.3 (去 v 前缀)
          VER="${UPSTREAM_TAG#v}"
          cd staging
          # npm version 会保持 JSON 格式正确 (不要手改 package.json)
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "package.json version 设为 $VER"
          cat package.json

      - name: 检查 npm 是否已发布此版本
        id: check_published
        run: |
          set -euo pipefail
          VER="${UPSTREAM_TAG#v}"
          # 查 npm registry: 200 = 已发布, 404 = 未发布
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.npmjs.org/reasonix-termux/${VER}")
          if [ "$HTTP" = "200" ]; then
            echo "already_published=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::reasonix-termux@${VER} 已发布, 跳过 publish 步骤"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::reasonix-termux@${VER} 未发布, 准备发布"
          fi

      - name: Setup Node.js
        if: steps.check_published.outputs.already_published != 'true'
        # setup-node 最新主版本 v7 (最新 release: v7.0.0, 2026-07-14)
        # 用 @v7 浮动 tag: 自动跟进 v7.x.x 补丁
        # 注意: 不传 registry-url, 让 OIDC 流程接管认证
        #       (传了会在 .npmrc 写空 token 占位符, 干扰 OIDC)
        # Node 24+: 自带 npm 11.x (OIDC trusted publishing 要求 npm >= 11.5.1)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 确保 npm >= 11.5.1 (OIDC trusted publishing 硬性要求)
        if: steps.check_published.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "当前 npm: $(npm --version)"
          npm install -g npm@latest
          NPMV=$(npm --version)
          echo "升级后 npm: $NPMV"
          # npm < 11.5.1 不支持 OIDC trusted publishing:
          # 它不认识 OIDC 流程, 又找不到 token, 于是报 ENEEDAUTH
          if [ "$(printf '%s\n' '11.5.1' "$NPMV" | sort -V | head -1)" != '11.5.1' ]; then
            echo "::error::npm $NPMV < 11.5.1, 无法使用 OIDC trusted publishing"
            exit 1
          fi

      - name: 预览将要发布的 tarball 内容 (npm pack --dry-run)
        if: steps.check_published.outputs.already_published != 'true'
        run: |
          cd staging
          npm pack --dry-run

      - name: 发布到 npm (OIDC trusted publishing + --provenance)
        if: steps.check_published.outputs.already_published != 'true'
        run: |
          cd staging
          # --access public: unscoped 包默认就 public, 显式更安全
          # --provenance: 启用供应链证明 (需要 id-token: write, 已在 job permissions 配置)
          # 不传 NODE_AUTH_TOKEN: 走 OIDC, npm CLI 会用 GitHub Actions 的 OIDC token
          #                       换短期 publish token (前提: npmjs.com 上已配 trusted publisher)
          npm publish --access public --provenance
          VER="${UPSTREAM_TAG#v}"
          echo "✓ 已发布 reasonix-termux@${VER}"
          echo "  https://www.npmjs.com/package/reasonix-termux/v/${VER}"

      - name: 汇总
        if: always()
        run: |
          VER="${UPSTREAM_TAG#v}"
          if [ "${{ steps.check_published.outputs.already_published }}" = "true" ]; then
            STATUS="跳过 (版本已存在)"
          else
            STATUS="已发布 (或尝试发布)"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## npm 发布: \`reasonix-termux@${VER}\`

          - 包名: \`reasonix-termux\` (unscoped)
          - 版本: \`${VER}\` (来自上游 tag \`${UPSTREAM_TAG}\`)
          - 二进制: android/arm64 静态 ELF (~11MB)
          - 平台限定: \`os: ["android"], cpu: ["arm64"]\` (npm 在非 Termux 平台拒装, EBADPLATFORM)
          - 认证模式: OIDC trusted publishing (无 NPM_TOKEN secret)
          - provenance: 启用 (id-token: write + npm --provenance)
          - 状态: ${STATUS}

          ### 安装方式 (在 Termux)

          \`\`\`bash
          # 需先有 Node.js (Termux: pkg install nodejs)
          npm install -g reasonix-termux
          reasonix --version
          \`\`\`

          ### 与 apt 安装的区别

          - npm: 装到 \`node_modules/.bin\`, 走 Node.js 全局 bin 路径
          - apt: 装到 \`\$PREFIX/bin/\` (\`/data/data/com.termux/files/usr/bin/\`)
          - 二者装的是同一个二进制, 选其一即可
          EOF
