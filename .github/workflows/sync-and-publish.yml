name: 同步并发布 Termux 源

# ---------------------------------------------------------------------------
# 自动检测 esengine/DeepSeek-Reasonix 上游 CLI 版本变化
# 构建 GOOS=android GOARCH=arm64 静态二进制 + deb 包 + apt 源元数据
# (patch atotto/clipboard 绕过 Android seccomp faccessat2 bug)
# 发布到本仓库的 orphan 分支 `apt`（类似 gh-pages 模式）
#
# 上游:    https://github.com/esengine/DeepSeek-Reasonix
# 安装源:  deb [trusted=yes] https://raw.githubusercontent.com/<OWNER>/<REPO>/apt stable main
#
# License: GPL-3.0
#   本 workflow 及仓库内所有脚本/资源按 GPL-3.0 发布
#   详见仓库根 LICENSE 文件或 https://www.gnu.org/licenses/gpl-3.0.html
# ---------------------------------------------------------------------------

on:
  schedule:
    # 每 6 小时检查一次上游 (UTC 00:30/06:30/12:30/18:30 -> Asia/Shanghai 08:30/14:30/20:30/02:30)
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（即使上游无更新）"
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      tag:
        description: "指定上游 tag 覆盖自动检测 (例: v1.19.7)"
        required: false
        type: string

permissions:
  contents: write    # 需要 push 到 apt 分支 + commit version.txt
  actions: read

concurrency:
  group: termux-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix
  # Termux apt 架构名 (注意: 是 aarch64 不是 arm64)
  TERMUX_ARCH: aarch64
  # Go 目标
  GOOS_TARGET: android
  GOARCH_TARGET: arm64
  # 发布分支 - orphan, 类似 gh-pages, 只放 apt 源文件
  APT_BRANCH: apt
  APT_DIST: stable
  APT_COMPONENT: main
  # Termux 安装前缀 (deb 数据文件路径)
  TERMUX_PREFIX: /data/data/com.termux/files/usr

jobs:
  detect:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: 检出本仓库 (main 分支, 用于读 version.txt)
        uses: actions/checkout@v7

      - name: 读取当前已发布版本
        id: current
        run: |
          if [ -f version.txt ]; then
            CUR=$(tr -d '[:space:]' < version.txt)
          else
            CUR="none"
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "::notice::当前已发布版本: $CUR"

      - name: 查询上游最新 CLI tag
        id: upstream
        run: |
          # GitHub API 列出最近 20 个 release (含 CLI 和 Desktop, 按时间倒序)
          # 过滤掉:
          #   - prerelease (预发布)
          #   - desktop-* 开头的 tag (Desktop 版, 我们只跟 CLI)
          #   - npm-* 开头的 tag (npm 包, 同上)
          # 取第一个匹配的 (即最新的 CLI stable release)
          UPSTREAM=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: termux-sync-bot" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" \
            | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^(desktop|npm)-") | not))][0].tag_name')
          if [ -z "$UPSTREAM" ] || [ "$UPSTREAM" = "null" ]; then
            echo "::error::无法获取上游最新 CLI tag"
            exit 1
          fi
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "::notice::上游最新 CLI tag: $UPSTREAM"

      - name: 决定是否需要发布
        id: check
        run: |
          UP="${{ inputs.tag || steps.upstream.outputs.upstream }}"
          CUR="${{ steps.current.outputs.current }}"
          FORCE="${{ inputs.force || 'false' }}"

          echo "upstream_tag=$UP" >> "$GITHUB_OUTPUT"
          echo "current_tag=$CUR" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 发布 (force=true, tag=$UP)"
          elif [ "$UP" != "$CUR" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 发布 (上游=$UP 与当前=$CUR 不一致)"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::决策: 跳过 (已处于 $CUR)"
          fi

  build:
    name: 构建二进制 + deb + apt 源
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    # 用普通 ubuntu-latest (amd64) runner 交叉编译即可
    #
    # 历史背景: 早期版本曾用 ubuntu-24.04-arm + termux-docker 镜像构建,
    # 当时的注释声称 "ubuntu 交叉编译 GOOS=android 时 runtime.GOOS 实际是 linux"
    # 这个说法是错的 - 实测验证 (Go 1.23) runtime.GOOS 是编译时常量,
    # 由 GOOS 环境变量决定, 与 host OS 无关:
    #   - GOOS=android 交叉编译 → runtime.GOOS == "android" ✓
    #   - GOOS=linux  交叉编译 → runtime.GOOS == "linux"
    #
    # Go 源码证据 (src/syscall/syscall_linux.go Faccessat 函数):
    #   if runtime.GOOS != "android" {
    #       faccessat2(...)  // Android seccomp 拦截这个
    #   }
    #   // fallback to fstatat + permission bits
    #
    # 所以只要 GOOS=android 编译, 就不会调 faccessat2, 不会 SIGSYS
    # 参考: golang/go#57393
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
    steps:
      - name: 检出本仓库 (main 分支)
        uses: actions/checkout@v7

      - name: 检出上游 Reasonix (tag ${{ env.UPSTREAM_TAG }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          fetch-depth: 1

      - name: 设置 Go (基于 upstream go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: true   # 启用 go module 缓存 (基于 upstream/go.sum)

      - name: Patch 源码 (TMPDIR + /tmp 硬编码 + clipboard LookPath)
        working-directory: upstream
        run: |
          set -euo pipefail
          # Patch 1: TMPDIR + /tmp 硬编码
          # 根因: Reasonix 用 os.MkdirTemp("", ...) → 默认 /tmp
          #   + internal/config/mutate.go 硬编码 filepath.Join("/", "tmp", ...)
          # Termux/Android 上 /tmp 只读 → "mkdir /tmp/reasonix-config-locks-...: permission denied"
          # 修复: 1. main() 入口设 TMPDIR=~/.reasonix/tmp/
          #       2. mutate.go 把硬编码 /tmp 改成 os.TempDir()
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- Patched mutate.go ---"
          grep -n "reasonix-config-locks" internal/config/mutate.go | head -3

          # Patch 2: atotto/clipboard init() 跳过 LookPath
          # 性能优化 (非必须, 不会 SIGSYS, 但能省启动时间):
          #   原实现 init() 调多次 exec.LookPath (xclip/xsel/wlcopy/...)
          #   每次 LookPath → findExecutable → Eaccess → Faccessat
          #   虽然 GOOS=android 时不会调 faccessat2 (不 SIGSYS),
          #   但仍会走 fstatat fallback, 浪费启动时间
          #   patch 后直接设 termux-clipboard-get/set, 不调 LookPath
          CLIPBOARD_FILE=$(find . -path '*/atto/clipboard/clipboard_unix.go' 2>/dev/null | head -1)
          if [ -n "$CLIPBOARD_FILE" ]; then
            python3 "$GITHUB_WORKSPACE/scripts/patch-clipboard.py" "$CLIPBOARD_FILE"
            echo "--- Patched $CLIPBOARD_FILE ---"
            sed -n '/^func init/,/^}/p' "$CLIPBOARD_FILE" | head -15
          else
            echo "::warning::未找到 atotto/clipboard/clipboard_unix.go, 跳过 clipboard patch"
          fi

      - name: 交叉编译 (GOOS=android GOARCH=arm64 CGO_ENABLED=0)
        working-directory: upstream
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"
          COMMIT=$(git rev-parse --short HEAD)

          mkdir -p ../build

          echo "=== go build (host=$(go version)) ==="
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X reasonix/internal/productdocs.linkedVersion=${TAG} -X reasonix/internal/productdocs.linkedRevision=${COMMIT}" \
            -o ../build/reasonix \
            ./cmd/reasonix

          echo "=== build info ==="
          ls -lh ../build/reasonix
          file ../build/reasonix

      - name: 静态验证二进制 (不运行, host 跑不了 android/arm64 二进制)
        run: |
          set -euo pipefail
          # 不能在 ubuntu amd64 上运行 android/arm64 二进制 (需要 /system/bin/linker64)
          # 改用静态验证: go version -m + strings + file
          echo "=== file ==="
          file build/reasonix

          echo ""
          echo "=== go version -m (build settings) ==="
          go version -m build/reasonix | head -20

          echo ""
          echo "=== GOOS / GOARCH 强校验 ==="
          BUILD_GOOS=$(go version -m build/reasonix | awk '/^\s+build\s+GOOS=/{split($2,a,"="); print a[2]}')
          BUILD_GOARCH=$(go version -m build/reasonix | awk '/^\s+build\s+GOARCH=/{split($2,a,"="); print a[2]}')
          echo "构建时 GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH"

          if [ "$BUILD_GOOS" != "android" ]; then
            echo "::error::GOOS=$BUILD_GOOS (应为 android), 二进制会在 Android 上 SIGSYS 崩溃"
            echo "排查: 检查 go build 命令是否设置了 GOOS=android 环境变量"
            exit 1
          fi
          if [ "$BUILD_GOARCH" != "arm64" ]; then
            echo "::error::GOARCH=$BUILD_GOARCH (应为 arm64)"
            exit 1
          fi
          echo "✓ GOOS=android GOARCH=arm64 (faccessat2 特判会生效, 不会 SIGSYS)"

          echo ""
          echo "=== faccessat2 syscall 字符串检查 (应为 0) ==="
          # Go runtime 在 GOOS=android 时不会编译进 faccessat2 调用
          # 如果二进制里出现 faccessat2 字符串, 说明编译配置错了
          FACCESSAT2_COUNT=$(strings build/reasonix | grep -ci 'faccessat2')
          echo "faccessat2 出现次数: $FACCESSAT2_COUNT"
          if [ "$FACCESSAT2_COUNT" -gt 0 ]; then
            echo "::warning::二进制里出现 faccessat2 字符串, 可能调用了被 Android seccomp 拦截的 syscall"
            echo "(注: 字符串存在不等于一定调用, 但 GOOS=android 时正常应为 0)"
          fi

      - name: 打包 .deb
        run: |
          set -euo pipefail
          bash scripts/build-deb.sh \
            "${UPSTREAM_TAG}" \
            "${{ env.TERMUX_ARCH }}" \
            "${{ env.TERMUX_PREFIX }}" \
            build/reasonix \
            build/

      - name: 生成 apt 源元数据
        run: |
          set -euo pipefail
          bash scripts/build-apt-repo.sh \
            build/ \
            "${{ env.APT_DIST }}" \
            "${{ env.APT_COMPONENT }}" \
            "${{ env.TERMUX_ARCH }}" \
            apt-root/

      - name: 显示 apt 源目录树
        run: find apt-root -type f -exec ls -lh {} \;

      - name: 上传 apt-root 为 workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: apt-root
          path: apt-root/
          retention-days: 7

  publish:
    name: 发布到 orphan `apt` 分支
    needs: [detect, build]
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
    steps:
      - name: 下载 apt-root artifact
        uses: actions/download-artifact@v8
        with:
          name: apt-root
          path: apt-root/

      - name: 检出 main 分支 (用于读 site/index.html + 后续更新 version.txt)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: main-branch
          fetch-depth: 1
          # persist-credentials 默认 true, 会把 GITHUB_TOKEN 写进 .git/config
          # 这样后面 git push 不需要再嵌入 token
          persist-credentials: true

      - name: 配置 git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 初始化 fresh orphan apt 分支 (始终单 commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 永远创建 fresh orphan 分支 - 历史永远只有 1 个 commit
          # 分支体积恒等于当前 deb 大小 + 主页 HTML, 不会随版本累积膨胀
          # 发布历史通过 main 分支的 version.txt commit log 保留
          mkdir -p apt-branch
          cd apt-branch
          git init -b ${{ env.APT_BRANCH }}
          # 关键: 必须把 GITHUB_TOKEN 嵌入 remote URL, 否则 push 时
          # git 会要求交互输入用户名密码, CI 无 TTY 导致 "could not read Username"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 用新构建产物替换 apt 分支内容
        run: |
          set -euo pipefail
          cd apt-branch

          # 复制新构建产物 (dists/stable/...)
          cp -a ../apt-root/. .

          # 复制主页 index.html (用于 GitHub Pages / Cloudflare Pages 部署)
          # 主页源文件在 main 分支的 site/ 目录, 由前面 checkout 步骤提供
          if [ -f ../main-branch/site/index.html ]; then
            cp ../main-branch/site/index.html ./index.html
            echo "✓ 已复制主页 index.html"
          else
            echo "::warning::未找到 site/index.html, 跳过主页部署"
          fi

          # .nojekyll: 告诉 GitHub Pages 跳过 Jekyll 处理
          # 避免 Jekyll 忽略下划线开头的文件/目录, 也加快 Pages 部署
          touch .nojekyll

          # CNAME: GitHub Pages 自定义域名
          # 内容为裸域名 rxt.cc.cd, 启用 GitHub Pages 后会自动绑定
          # (Cloudflare Pages 不需要此文件, 但留着不会影响)
          echo "rxt.cc.cd" > CNAME
          echo "✓ 已写入 CNAME (rxt.cc.cd)"

          # 写一个 README 给访问者
          cat > README.md <<'README_EOF'
          # Reasonix Termux APT 源 (自动发布)

          最新版本: ${UPSTREAM_TAG}

          ## 安装方法 (在 Termux 中)

          ```bash
          echo 'deb [trusted=yes] https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apt stable main' \
            > $PREFIX/etc/apt/sources.list.d/reasonix.list
          pkg update
          pkg install reasonix
          reasonix --version
          ```

          ## 分支内容

          这是一个 orphan 分支 (单 commit, 每次发布重置历史),
          只包含 apt 源文件 + 一个主页 index.html:

          ```
          index.html                                       # 项目主页 (GitHub Pages / Cloudflare Pages 用)
          dists/stable/Release                             # apt 元数据
          dists/stable/main/binary-aarch64/Packages        # 包索引
          dists/stable/main/binary-aarch64/Packages.gz     # 包索引 (gzip)
          dists/stable/main/binary-aarch64/reasonix_<version>_aarch64.deb
          ```

          源 workflow 在 main 分支上。
          README_EOF

          # 把 ${UPSTREAM_TAG} 和 ${GITHUB_REPOSITORY} 填进 README
          # (上面的 'README_EOF' 用了单引号防止 $ 提前展开, 这里手动替换)
          sed -i \
            -e "s|\${UPSTREAM_TAG}|${UPSTREAM_TAG}|g" \
            -e "s|\${GITHUB_REPOSITORY}|${GITHUB_REPOSITORY}|g" \
            README.md

          # 显示将要提交的内容
          echo "--- 待提交文件 ---"
          find . -mindepth 1 -maxdepth 5 -not -path './.git*' -type f | sort

          git add -A
          git status

      - name: 提交并 force-push 到 apt 分支 (orphan, 单 commit)
        run: |
          set -euo pipefail
          cd apt-branch

          # orphan commit - 没有父 commit
          git commit --allow-empty -m "发布 reasonix ${UPSTREAM_TAG}

          构建参数: GOOS=android GOARCH=arm64 CGO_ENABLED=0
          Patch: atotto/clipboard init() 绕过 Android seccomp faccessat2 bug
          上游源码: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${UPSTREAM_TAG}"

          # Force push - orphan 分支每次都覆盖, 永远只有 1 个 commit
          # 优势: 分支体积 ≈ 当前 deb 大小, 不随版本累积
          # 发布历史通过 main 分支的 version.txt commit log 保留
          git push origin ${{ env.APT_BRANCH }} --force

      - name: 在 main 分支提交 version.txt
        run: |
          set -euo pipefail
          cd main-branch
          echo "${UPSTREAM_TAG}" > version.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if git diff --cached --quiet; then
            echo "version.txt 未变化"
          else
            git commit -m "chore: 已发布版本更新为 ${UPSTREAM_TAG}"
            # actions/checkout 已配置 token, 直接 push 即可
            git push
          fi

      - name: 汇总
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 已发布: \`${UPSTREAM_TAG}\`

          推送到 orphan 分支 \`${{ env.APT_BRANCH }}\` (force-push, 单 commit)。

          ### Termux 安装命令:

          \`\`\`bash
          echo 'deb [trusted=yes] https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list
          pkg update
          pkg install reasonix
          reasonix --version
          \`\`\`

          ### 备用镜像 (如果 raw.githubusercontent.com 被墙):

          \`\`\`bash
          # jsDelivr CDN (海外更快, 国内有时被墙)
          echo 'deb [trusted=yes] https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list

          # GitHub /raw/ URL (同 raw, 走 github.com 域名)
          echo 'deb [trusted=yes] https://github.com/${GITHUB_REPOSITORY}/raw/${{ env.APT_BRANCH }} stable main' \\
            > \$PREFIX/etc/apt/sources.list.d/reasonix.list
          \`\`\`

          ### apt 分支上的文件:

          \`\`\`
          index.html                                          # 项目主页 (Pages 部署用)
          dists/stable/Release
          dists/stable/main/binary-aarch64/Packages
          dists/stable/main/binary-aarch64/Packages.gz
          dists/stable/main/binary-aarch64/reasonix_${UPSTREAM_TAG#v}_aarch64.deb
          \`\`\`

          ### 主页访问 (启用 GitHub Pages / Cloudflare Pages 后):

          - GitHub Pages: \`https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}/\`
            (仓库 Settings → Pages → Source = apt 分支)
          - Cloudflare Pages: 自定义域名 (Production branch = apt)
          - 直接访问 raw: \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ env.APT_BRANCH }}/index.html\`
          EOF
