name: 测试构建 (不发 deb)

# 只构建二进制 + 测试, 不打包 deb, 不推送 apt 分支
# 用于验证 GOOS=android 二进制在 Termux 上能否正常运行

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "指定上游 tag (例: v1.20.0), 留空用最新"
        required: false
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix
  GOARCH_TARGET: arm64

jobs:
  test-build:
    name: 构建 + 测试二进制
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 查询上游最新 tag
        id: upstream
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: termux-test-bot" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" \
              | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^(desktop|npm)-") | not))][0].tag_name')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::测试 tag: $TAG"

      - name: 检出上游 Reasonix (tag ${{ steps.upstream.outputs.tag }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: 缓存 Termux Docker 镜像 (arm64)
        uses: actions/cache@v6
        with:
          path: /tmp/termux-docker-image
          key: termux-docker-latest-arm64-v1
          restore-keys: |
            termux-docker-latest-arm64-

      - name: 加载/拉取 Termux Docker 镜像
        run: |
          if [ -f /tmp/termux-docker-image/termux-docker.tar ]; then
            echo "✓ 加载缓存的 Termux Docker 镜像"
            docker load < /tmp/termux-docker-image/termux-docker.tar
            # 验证架构
            IMG_ARCH=$(docker inspect termux/termux-docker:latest --format '{{.Architecture}}' 2>/dev/null || echo "unknown")
            echo "镜像架构: $IMG_ARCH"
            if [ "$IMG_ARCH" != "arm64" ] && [ "$IMG_ARCH" != "aarch64" ]; then
              echo "::warning::缓存镜像架构是 $IMG_ARCH, 需要 arm64, 重新拉取"
              docker rmi termux/termux-docker:latest 2>/dev/null || true
              docker pull termux/termux-docker:latest
              docker save termux/termux-docker:latest > /tmp/termux-docker-image/termux-docker.tar
            fi
          else
            echo "首次运行, 拉取 Termux Docker 镜像 (arm64)"
            docker pull termux/termux-docker:latest
            mkdir -p /tmp/termux-docker-image
            docker save termux/termux-docker:latest > /tmp/termux-docker-image/termux-docker.tar
            echo "✓ 镜像已缓存 ($(du -sh /tmp/termux-docker-image/termux-docker.tar | cut -f1))"
          fi

      - name: Patch 源码 (TMPDIR + /tmp 硬编码)
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- Patched mutate.go (lock dir) ---"
          grep -n "reasonix-config-locks" internal/config/mutate.go | head -3

      - name: 在 Termux 容器里构建 + 测试
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"

          cat > /tmp/build-and-test.sh <<BUILD_SCRIPT
          set -euo pipefail
          cd /home/builder/work

          # 切官方源 CF 缓存版
          echo "deb https://packages-cf.termux.dev/apt/termux-main stable main" > \$PREFIX/etc/apt/sources.list
          echo "=== sources.list ==="
          cat \$PREFIX/etc/apt/sources.list

          # apt update (用 apt 而非 pkg, pkg 会自动测速)
          apt update

          # 装 Go + git + file
          apt install -y golang git file

          # 修复 git dubious ownership
          git config --global --add safe.directory /home/builder/work

          # 读 go.mod 版本
          REQUIRED_GO=\$(head -1 go.mod | grep -oE "go [0-9]+\.[0-9]+" | cut -d' ' -f2 || echo "1.26")
          INSTALLED_GO=\$(go version | grep -oE "go[0-9]+\.[0-9]+\.[0-9]+" | sed 's/go//')
          echo "Required Go: \$REQUIRED_GO, Installed: \$INSTALLED_GO"

          COMMIT=\$(git rev-parse --short HEAD)
          mkdir -p /home/builder/out

          echo "=== go build (GOOS=android GOARCH=arm64 CGO_ENABLED=0) ==="
          CGO_ENABLED=0 \\
          GOOS=android \\
          GOARCH=arm64 \\
          go build \\
            -trimpath \\
            -ldflags "-s -w -X main.version=${TAG} -X reasonix/internal/productdocs.linkedVersion=${TAG} -X reasonix/internal/productdocs.linkedRevision=\${COMMIT}" \\
            -o /home/builder/out/reasonix \\
            ./cmd/reasonix

          echo "=== build info ==="
          go version -m /home/builder/out/reasonix | head -5
          file /home/builder/out/reasonix
          ls -lh /home/builder/out/reasonix

          # 直接在容器里测试
          echo "=== 测试 ./reasonix -v ==="
          chmod +x /home/builder/out/reasonix
          TEST_OUTPUT=\$(/home/builder/out/reasonix -v 2>&1 || true)
          echo "原始输出:"
          echo "\$TEST_OUTPUT" | head -15

          echo "=== 结果检查 ==="
          if echo "\$TEST_OUTPUT" | grep -qi "cannot execute\|Exec format"; then
            echo "::error::二进制无法执行 (Exec format error) - 容器架构不匹配"
            exit 1
          fi
          if echo "\$TEST_OUTPUT" | grep -qi "SIGSYS\|bad system call"; then
            echo "::error::二进制 SIGSYS 崩溃 (faccessat2 被 seccomp 拒绝)"
            echo "\$TEST_OUTPUT" | tail -10
            exit 1
          fi
          if [ -z "\$TEST_OUTPUT" ]; then
            echo "::error::二进制无输出, 可能静默崩溃"
            exit 1
          fi
          echo "✓ 二进制可正常运行"
          echo "输出前 3 行: \$(echo "\$TEST_OUTPUT" | head -3)"
          BUILD_SCRIPT

          # 去掉缩进
          sed -i 's/^          //' /tmp/build-and-test.sh

          mkdir -p build
          chmod 777 build

          docker run --rm \
            -v "$PWD/upstream:/home/builder/work" \
            -v "$PWD/build:/home/builder/out" \
            -v "/tmp/build-and-test.sh:/home/builder/build.sh:ro" \
            termux/termux-docker:latest \
            bash /home/builder/build.sh

          echo "=== 本地验证 ==="
          file build/reasonix
          ls -lh build/reasonix

      - name: 上传二进制为 artifact (供下载测试)
        uses: actions/upload-artifact@v7
        with:
          name: reasonix-binary-test
          path: build/reasonix
          retention-days: 7
