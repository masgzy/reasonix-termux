name: 测试交叉编译 (不用 Docker)

# 两个架构的 runner 都编译 GOOS=android GOARCH=arm64
# 对比不同 GOHOSTARCH 编出来的二进制 runtime.GOOS 是否不同
# 可通过菜单选择: all / arm64 / amd64

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "runner 架构 (都编译 android/arm64)"
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64
          - amd64

permissions:
  contents: read

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix

jobs:
  detect:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: 查询上游最新 CLI tag
        id: upstream
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: termux-test-bot" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" \
            | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^(desktop|npm)-") | not))][0].tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::上游 tag: $TAG"

  config:
    name: 计算矩阵
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ARCH="${{ inputs.arch }}"
          if [ "$ARCH" = "all" ]; then
            echo 'matrix=[{"runner":"ubuntu-24.04-arm","label":"arm64-runner"},{"runner":"ubuntu-latest","label":"amd64-runner"}]' >> "$GITHUB_OUTPUT"
          elif [ "$ARCH" = "arm64" ]; then
            echo 'matrix=[{"runner":"ubuntu-24.04-arm","label":"arm64-runner"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"runner":"ubuntu-latest","label":"amd64-runner"}]' >> "$GITHUB_OUTPUT"
          fi

  cross-build:
    name: 编译 android/arm64 (${{ matrix.label }})
    needs: [detect, config]
    strategy:
      matrix:
        include: ${{ fromJson(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 检出上游 Reasonix (tag ${{ env.UPSTREAM_TAG }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          fetch-depth: 1

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Patch 源码 (TMPDIR + /tmp 硬编码)
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- Patched mutate.go ---"
          grep -n "reasonix-config-locks" internal/config/mutate.go | head -3

      - name: 编译 (GOOS=android GOARCH=arm64, runner=${{ matrix.label }})
        working-directory: upstream
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"
          COMMIT=$(git rev-parse --short HEAD)
          FILENAME="reasonix-android-arm64-${{ matrix.label }}"

          echo "=== runner info ==="
          uname -m
          go env GOHOSTOS GOHOSTARCH

          echo "=== go build (GOOS=android GOARCH=arm64 CGO_ENABLED=0) ==="
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X reasonix/internal/productdocs.linkedVersion=${TAG} -X reasonix/internal/productdocs.linkedRevision=${COMMIT}" \
            -o ../${FILENAME} \
            ./cmd/reasonix

          echo "=== build info ==="
          go version -m ../${FILENAME} | grep -E "GOOS|GOARCH|GOHOSTOS|GOHOSTARCH|path|go1"
          file ../${FILENAME}
          ls -lh ../${FILENAME}

      - name: 上传二进制为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: reasonix-android-arm64-${{ matrix.label }}
          path: reasonix-android-arm64-${{ matrix.label }}
          retention-days: 7
