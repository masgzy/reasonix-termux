name: 测试交叉编译 (不用 Docker)

# 直接在 ubuntu runner 上交叉编译, 不用 termux-docker
# 两个 job: arm64 + amd64, 都用 GOOS=android
# 产出两个二进制, 打包成 zip 上传 artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix

jobs:
  detect:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: 查询上游最新 CLI tag
        id: upstream
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: termux-test-bot" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" \
            | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^(desktop|npm)-") | not))][0].tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::上游 tag: $TAG"

  cross-build:
    name: 交叉编译 ${{ matrix.arch }}
    needs: detect
    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            filename: reasonix-android-arm64
          - arch: amd64
            goarch: amd64
            filename: reasonix-android-amd64
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 检出上游 Reasonix (tag ${{ env.UPSTREAM_TAG }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          fetch-depth: 1

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Patch 源码 (TMPDIR + /tmp 硬编码)
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- Patched mutate.go ---"
          grep -n "reasonix-config-locks" internal/config/mutate.go | head -3

      - name: 交叉编译 (GOOS=android GOARCH=${{ matrix.goarch }})
        working-directory: upstream
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"
          COMMIT=$(git rev-parse --short HEAD)

          echo "=== go build (GOOS=android GOARCH=${{ matrix.goarch }} CGO_ENABLED=0) ==="
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=${{ matrix.goarch }} \
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X reasonix/internal/productdocs.linkedVersion=${TAG} -X reasonix/internal/productdocs.linkedRevision=${COMMIT}" \
            -o ../${{ matrix.filename }} \
            ./cmd/reasonix

          echo "=== build info ==="
          go version -m ../${{ matrix.filename }} | head -5
          file ../${{ matrix.filename }}
          ls -lh ../${{ matrix.filename }}

      - name: 上传二进制为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          retention-days: 7

  package:
    name: 打包两个二进制为 zip
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有二进制
        uses: actions/download-artifact@v8
        with:
          name: reasonix-android-arm64
          path: ./arm64
      - uses: actions/download-artifact@v8
        with:
          name: reasonix-android-amd64
          path: ./amd64

      - name: 整理文件 + 打包
        run: |
          mkdir -p release
          cp arm64/reasonix-android-arm64 release/
          cp amd64/reasonix-android-amd64 release/
          chmod +x release/*
          ls -lh release/

          cd release
          zip ../reasonix-android-binaries.zip .
          cd ..
          ls -lh reasonix-android-binaries.zip

      - name: 上传 zip 为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: reasonix-android-binaries
          path: reasonix-android-binaries.zip
          retention-days: 7
