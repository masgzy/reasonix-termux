name: 测试交叉编译 (不用 Docker)

# 在对应架构的 runner 上原生编译 GOOS=android GOARCH=<arch>
# 不用 docker, 直接用 actions/setup-go
# 可通过菜单选择: all / arm64 / amd64

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "编译架构"
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64
          - amd64

permissions:
  contents: read

env:
  UPSTREAM_REPO: esengine/DeepSeek-Reasonix

jobs:
  detect:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: 查询上游最新 CLI tag
        id: upstream
        run: |
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: termux-test-bot" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" \
            | jq -r '[.[] | select(.prerelease == false and (.tag_name | test("^(desktop|npm)-") | not))][0].tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::上游 tag: $TAG"

  # 根据 inputs.arch 过滤要跑的架构
  config:
    name: 计算矩阵
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ARCH="${{ inputs.arch }}"
          if [ "$ARCH" = "all" ]; then
            echo 'matrix=[{"arch":"arm64","runner":"ubuntu-24.04-arm","filename":"reasonix-android-arm64"},{"arch":"amd64","runner":"ubuntu-latest","filename":"reasonix-android-amd64"}]' >> "$GITHUB_OUTPUT"
          elif [ "$ARCH" = "arm64" ]; then
            echo 'matrix=[{"arch":"arm64","runner":"ubuntu-24.04-arm","filename":"reasonix-android-arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"arch":"amd64","runner":"ubuntu-latest","filename":"reasonix-android-amd64"}]' >> "$GITHUB_OUTPUT"
          fi

  cross-build:
    name: 编译 ${{ matrix.arch }}
    needs: [detect, config]
    strategy:
      matrix:
        include: ${{ fromJson(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 检出上游 Reasonix (tag ${{ env.UPSTREAM_TAG }})
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          fetch-depth: 1

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Patch 源码 (TMPDIR + /tmp 硬编码)
        working-directory: upstream
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-tmpdir.py" .
          echo "--- Patched main() ---"
          sed -n '/^func main/,/^}/p' cmd/reasonix/main.go | head -15
          echo "--- Patched mutate.go ---"
          grep -n "reasonix-config-locks" internal/config/mutate.go | head -3

      - name: 编译 (GOOS=android GOARCH=${{ matrix.arch }})
        working-directory: upstream
        run: |
          set -euo pipefail
          TAG="${UPSTREAM_TAG}"
          COMMIT=$(git rev-parse --short HEAD)

          echo "=== go build (GOOS=android GOARCH=${{ matrix.arch }} CGO_ENABLED=0) ==="
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=${{ matrix.arch }} \
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X reasonix/internal/productdocs.linkedVersion=${TAG} -X reasonix/internal/productdocs.linkedRevision=${COMMIT}" \
            -o ../${{ matrix.filename }} \
            ./cmd/reasonix

          echo "=== build info ==="
          go version -m ../${{ matrix.filename }} | head -5
          file ../${{ matrix.filename }}
          ls -lh ../${{ matrix.filename }}

      - name: 上传二进制为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          retention-days: 7
